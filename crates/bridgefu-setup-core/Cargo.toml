[package]
name = "bridgefu-setup-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Shared setup engine for Bridgefu Vapi to Amazon Connect deployments"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
aws-config = "1"
aws-sdk-secretsmanager = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
vapire-iac = { path = "../vapire-iac", version = "=0.1.0" }
zip = { version = "4", default-features = false, features = ["deflate"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
