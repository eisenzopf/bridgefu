[package]
name = "vapire-iac"
version = "0.1.0"
edition = "2021"
description = "Ownership-safe Vapi infrastructure-as-code engine"
license = "MIT"
repository = "https://github.com/jonathan/vapire"
keywords = ["vapi", "iac", "voice-ai"]
categories = ["api-bindings", "development-tools"]
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
