      PlacementConstraints: [{Type: memberOf, Expression: 'attribute:bridgefu.slot == worker-a'}]
      LoadBalancers: [{ContainerName: bridgefu, ContainerPort: 9443, TargetGroupArn: !Ref WorkerATargetGroupArn}]
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
