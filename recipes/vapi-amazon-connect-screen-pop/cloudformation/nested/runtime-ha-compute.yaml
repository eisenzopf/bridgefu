  GatewayTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'bridgefu-${DeploymentId}-gateway'
      RequiresCompatibilities: [EC2]
      NetworkMode: host
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt GatewayTaskRole.Arn
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Volumes:
        - {Name: config, Host: {SourcePath: /etc/bridgefu}}
        - {Name: secrets, Host: {SourcePath: /run/bridgefu/secrets}}
      ContainerDefinitions:
        - Name: bridgefu
          Image: !Ref BridgefuImageUri
          Essential: true
          User: '65532:65532'
          ReadonlyRootFilesystem: true
          Privileged: false
          LinuxParameters:
            Capabilities: {Drop: [ALL]}
            InitProcessEnabled: true
          StopTimeout: 120
          Command: [--config, /etc/bridgefu/bridgefu.yaml]
          Environment:
            - {Name: AWS_REGION, Value: !Ref AWS::Region}
            - {Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region}
            - {Name: BRIDGEFU_API_BEARER_TOKEN_FILE, Value: /run/bridgefu/secrets/api-bearer}
            - {Name: BRIDGEFU_CONTROL_HMAC_KEY_FILE, Value: /run/bridgefu/secrets/control-hmac}
            - {Name: BRIDGEFU_PRIVATE_FORWARDING_SECRET_FILE, Value: /run/bridgefu/secrets/private-forwarding}
            - {Name: BRIDGEFU_BROADCAST_TOKEN_SECRET_FILE, Value: /run/bridgefu/secrets/broadcast-token}
            - {Name: BRIDGEFU_DATABASE_URL_FILE, Value: /run/bridgefu/secrets/database-url}
            - {Name: BRIDGEFU_REDIS_URL_FILE, Value: /run/bridgefu/secrets/redis-url}
          MountPoints:
            - {SourceVolume: config, ContainerPath: /etc/bridgefu, ReadOnly: true}
            - {SourceVolume: secrets, ContainerPath: /run/bridgefu/secrets, ReadOnly: true}
          PortMappings:
            - {ContainerPort: 5060, HostPort: 5060, Protocol: tcp}
            - {ContainerPort: 5060, HostPort: 5060, Protocol: udp}
            - {ContainerPort: 5061, HostPort: 5061, Protocol: tcp}
            - {ContainerPort: 9080, HostPort: 9080, Protocol: tcp}
            - {ContainerPort: 9090, HostPort: 9090, Protocol: tcp}
            - {ContainerPort: 4433, HostPort: 4433, Protocol: udp}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RuntimeLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: gateway
      Tags:
        - {Key: Project, Value: !Ref ProjectTag}
        - {Key: ManagedBy, Value: !Ref ManagedByTag}
        - {Key: BridgefuExecutionId, Value: !Ref ExecutionIdTag}

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'bridgefu-${DeploymentId}-worker'
      RequiresCompatibilities: [EC2]
      NetworkMode: host
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerTaskRole.Arn
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Volumes:
        - {Name: config, Host: {SourcePath: /etc/bridgefu}}
        - {Name: secrets, Host: {SourcePath: /run/bridgefu/secrets}}
      ContainerDefinitions:
        - Name: bridgefu
          Image: !Ref BridgefuImageUri
          Essential: true
          User: '65532:65532'
          ReadonlyRootFilesystem: true
          Privileged: false
          LinuxParameters:
            Capabilities: {Drop: [ALL]}
            InitProcessEnabled: true
          StopTimeout: 120
          Command: [--config, /etc/bridgefu/bridgefu.yaml]
          Environment:
            - {Name: AWS_REGION, Value: !Ref AWS::Region}
            - {Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region}
            - {Name: BRIDGEFU_API_BEARER_TOKEN_FILE, Value: /run/bridgefu/secrets/api-bearer}
            - {Name: BRIDGEFU_CONTROL_HMAC_KEY_FILE, Value: /run/bridgefu/secrets/control-hmac}
            - {Name: BRIDGEFU_PRIVATE_FORWARDING_SECRET_FILE, Value: /run/bridgefu/secrets/private-forwarding}
            - {Name: BRIDGEFU_BROADCAST_TOKEN_SECRET_FILE, Value: /run/bridgefu/secrets/broadcast-token}
            - {Name: BRIDGEFU_DATABASE_URL_FILE, Value: /run/bridgefu/secrets/database-url}
            - {Name: BRIDGEFU_REDIS_URL_FILE, Value: /run/bridgefu/secrets/redis-url}
          MountPoints:
            - {SourceVolume: config, ContainerPath: /etc/bridgefu, ReadOnly: true}
            - {SourceVolume: secrets, ContainerPath: /run/bridgefu/secrets, ReadOnly: true}
          PortMappings:
            - {ContainerPort: 9443, HostPort: 9443, Protocol: udp}
            - {ContainerPort: 9090, HostPort: 9090, Protocol: tcp}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RuntimeLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker
      Tags:
        - {Key: Project, Value: !Ref ProjectTag}
        - {Key: ManagedBy, Value: !Ref ManagedByTag}
        - {Key: BridgefuExecutionId, Value: !Ref ExecutionIdTag}

  GatewayServiceA:
    Type: AWS::ECS::Service
    DependsOn: GatewayAsgA
    Properties:
      ServiceName: gateway-a
      Cluster: !Ref Cluster
      LaunchType: EC2
      DesiredCount: 1
      TaskDefinition: !Ref GatewayTaskDefinition
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      HealthCheckGracePeriodSeconds: 300
      PlacementConstraints: [{Type: memberOf, Expression: 'attribute:bridgefu.slot == gateway-a'}]
      LoadBalancers:
        - {ContainerName: bridgefu, ContainerPort: !If [SecureSip, 5061, 5060], TargetGroupArn: !Ref PublicSignalingTargetGroupArn}
        - {ContainerName: bridgefu, ContainerPort: 9080, TargetGroupArn: !Ref ControlTargetGroupArn}
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
        - {Key: Project, Value: !Ref ProjectTag}
        - {Key: ManagedBy, Value: !Ref ManagedByTag}
        - {Key: BridgefuSlot, Value: gateway-a}

  GatewayServiceB:
    Type: AWS::ECS::Service
    DependsOn: GatewayAsgB
    Properties:
      ServiceName: gateway-b
      Cluster: !Ref Cluster
      LaunchType: EC2
      DesiredCount: 1
      TaskDefinition: !Ref GatewayTaskDefinition
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      HealthCheckGracePeriodSeconds: 300
      PlacementConstraints: [{Type: memberOf, Expression: 'attribute:bridgefu.slot == gateway-b'}]
      LoadBalancers:
        - {ContainerName: bridgefu, ContainerPort: !If [SecureSip, 5061, 5060], TargetGroupArn: !Ref PublicSignalingTargetGroupArn}
        - {ContainerName: bridgefu, ContainerPort: 9080, TargetGroupArn: !Ref ControlTargetGroupArn}
