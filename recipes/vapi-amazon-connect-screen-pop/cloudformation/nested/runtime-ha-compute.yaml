        - {Key: Project, Value: !Ref ProjectTag, PropagateAtLaunch: true}
        - {Key: ManagedBy, Value: !Ref ManagedByTag, PropagateAtLaunch: true}
        - {Key: BridgefuExecutionId, Value: !Ref ExecutionIdTag, PropagateAtLaunch: true}
