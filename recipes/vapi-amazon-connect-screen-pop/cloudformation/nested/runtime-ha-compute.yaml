  WorkerServiceB:
    Type: AWS::ECS::Service
    DependsOn: WorkerAsgB
    Properties:
      ServiceName: worker-b
      Cluster: !Ref Cluster
      LaunchType: EC2
      DesiredCount: 1
      TaskDefinition: !Ref WorkerTaskDefinition
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      HealthCheckGracePeriodSeconds: 300
      PlacementConstraints: [{Type: memberOf, Expression: 'attribute:bridgefu.slot == worker-b'}]
      LoadBalancers: [{ContainerName: bridgefu, ContainerPort: 9443, TargetGroupArn: !Ref WorkerBTargetGroupArn}]
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
        - {Key: Project, Value: !Ref ProjectTag}
        - {Key: ManagedBy, Value: !Ref ManagedByTag}
        - {Key: BridgefuSlot, Value: worker-b}

  LifecycleTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'bridgefu-${DeploymentId}-ha-lifecycle'
      KmsMasterKeyId: alias/aws/sns
      Tags:
        - {Key: Project, Value: !Ref ProjectTag}
        - {Key: ManagedBy, Value: !Ref ManagedByTag}
        - {Key: BridgefuExecutionId, Value: !Ref ExecutionIdTag}

  LifecyclePublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bridgefu-${DeploymentId}-ha-lifecycle-publish'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: autoscaling.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: PublishExactLifecycleTopic
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{Effect: Allow, Action: sns:Publish, Resource: !Ref LifecycleTopic}]

  LifecycleFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bridgefu-${DeploymentId}-ha-lifecycle'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: DrainExactCluster
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ecs:ListContainerInstances, ecs:UpdateContainerInstancesState, ecs:ListTasks, ecs:StopTask, ecs:DescribeTasks]
                Resource: '*'
              - Effect: Allow
                Action: autoscaling:CompleteLifecycleAction
                Resource: '*'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${LifecycleLogGroup.Arn}:*'

  LifecycleFunction:
    Type: AWS::Lambda::Function
    DependsOn: LifecycleLogGroup
    Properties:
      FunctionName: !Sub 'bridgefu-${DeploymentId}-ha-drain'
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt LifecycleFunctionRole.Arn
      Timeout: 180
      MemorySize: 128
      Environment: {Variables: {CLUSTER: !Ref Cluster}}
      Code:
        ZipFile: |
          import boto3,json,os,time
          ecs=boto3.client('ecs'); autoscaling=boto3.client('autoscaling')
          def handler(event,context):
              message=json.loads(event['Records'][0]['Sns']['Message'])
              if message.get('LifecycleTransition')!='autoscaling:EC2_INSTANCE_TERMINATING': return
              instance=message['EC2InstanceId']; cluster=os.environ['CLUSTER']
              found=ecs.list_container_instances(cluster=cluster,filter=f'ec2InstanceId == {instance}')['containerInstanceArns']
              if found:
                  container=found[0]
                  ecs.update_container_instances_state(cluster=cluster,containerInstances=[container],status='DRAINING')
                  tasks=ecs.list_tasks(cluster=cluster,containerInstance=container,desiredStatus='RUNNING')['taskArns']
                  for task in tasks: ecs.stop_task(cluster=cluster,task=task,reason='Bridgefu HA lifecycle drain')
                  deadline=time.time()+130
                  while tasks and time.time()<deadline:
                      time.sleep(5)
                      tasks=ecs.list_tasks(cluster=cluster,containerInstance=container,desiredStatus='RUNNING')['taskArns']
              autoscaling.complete_lifecycle_action(LifecycleHookName=message['LifecycleHookName'],AutoScalingGroupName=message['AutoScalingGroupName'],LifecycleActionToken=message['LifecycleActionToken'],LifecycleActionResult='CONTINUE')

  LifecycleSubscription:
    Type: AWS::SNS::Subscription
    Properties: {TopicArn: !Ref LifecycleTopic, Protocol: lambda, Endpoint: !GetAtt LifecycleFunction.Arn}

  LifecycleInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LifecycleFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref LifecycleTopic

  GatewayAHook:
    Type: AWS::AutoScaling::LifecycleHook
    Properties: {AutoScalingGroupName: !Ref GatewayAsgA, LifecycleTransition: 'autoscaling:EC2_INSTANCE_TERMINATING', HeartbeatTimeout: 300, DefaultResult: CONTINUE, NotificationTargetARN: !Ref LifecycleTopic, RoleARN: !GetAtt LifecyclePublishRole.Arn}
  GatewayBHook:
    Type: AWS::AutoScaling::LifecycleHook
    Properties: {AutoScalingGroupName: !Ref GatewayAsgB, LifecycleTransition: 'autoscaling:EC2_INSTANCE_TERMINATING', HeartbeatTimeout: 300, DefaultResult: CONTINUE, NotificationTargetARN: !Ref LifecycleTopic, RoleARN: !GetAtt LifecyclePublishRole.Arn}
  WorkerAHook:
    Type: AWS::AutoScaling::LifecycleHook
    Properties: {AutoScalingGroupName: !Ref WorkerAsgA, LifecycleTransition: 'autoscaling:EC2_INSTANCE_TERMINATING', HeartbeatTimeout: 300, DefaultResult: CONTINUE, NotificationTargetARN: !Ref LifecycleTopic, RoleARN: !GetAtt LifecyclePublishRole.Arn}
  WorkerBHook:
    Type: AWS::AutoScaling::LifecycleHook
    Properties: {AutoScalingGroupName: !Ref WorkerAsgB, LifecycleTransition: 'autoscaling:EC2_INSTANCE_TERMINATING', HeartbeatTimeout: 300, DefaultResult: CONTINUE, NotificationTargetARN: !Ref LifecycleTopic, RoleARN: !GetAtt LifecyclePublishRole.Arn}

Outputs:
  ClusterName: {Value: !Ref Cluster}
  GatewayServiceAName: {Value: !GetAtt GatewayServiceA.Name}
  GatewayServiceBName: {Value: !GetAtt GatewayServiceB.Name}
  WorkerServiceAName: {Value: !GetAtt WorkerServiceA.Name}
  WorkerServiceBName: {Value: !GetAtt WorkerServiceB.Name}
  GatewayAsgAName: {Value: !Ref GatewayAsgA}
  GatewayAsgBName: {Value: !Ref GatewayAsgB}
  WorkerAsgAName: {Value: !Ref WorkerAsgA}
  WorkerAsgBName: {Value: !Ref WorkerAsgB}
  RuntimeLogGroupName: {Value: !Ref RuntimeLogGroup}
  ReadinessEvidence: {Value: 'four ECS services stabilized across two Availability Zones'}
  SsmInventoryCommand:
    Value: !Sub >-
      aws ec2 describe-instances --region ${AWS::Region} --filters
      Name=tag:BridgefuExecutionId,Values=${ExecutionIdTag} Name=instance-state-name,Values=running
