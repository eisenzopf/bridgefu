AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Temporary, service-scoped deployment role for an approved Bridgefu recipe
  qualification run. Delete this bootstrap stack after the recipe and artifacts.

# The live AWS::Connect resource-provider schemas currently require several
# newly introduced IAM actions that cfn-lint's IAM catalog does not yet know.
# The live AWS resource-provider schema is authoritative for this exception.
Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W3037

Parameters:
  ExecutionId:
    Type: String
    MinLength: 8
    MaxLength: 24
    AllowedPattern: '^bft-[a-z0-9-]+$'
  TrustedPrincipalArn:
    Type: String
    AllowedPattern: '^arn:aws[-a-z0-9]*:iam::[0-9]{12}:(root|user/[A-Za-z0-9+=,.@_/-]+|role/[A-Za-z0-9+=,.@_/-]+)$'
  GitHubOidcProviderArn:
    Type: String
    Default: none
    AllowedPattern: '^(none|arn:aws[-a-z0-9]*:iam::[0-9]{12}:oidc-provider/token.actions.githubusercontent.com)$'
  GitHubRepository:
    Type: String
    Default: eisenzopf/bridgefu
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
  GitHubEnvironment:
    Type: String
    Default: none
    AllowedPattern: '^(none|bridgefu-(nonproduction|production))$'
  ConnectInstanceArn:
    Type: String
    Default: arn:aws:connect:us-east-1:000000000000:instance/unused
    AllowedPattern: '^arn:aws[-a-z0-9]*:connect:[-a-z0-9]+:[0-9]{12}:instance/[A-Za-z0-9-]+$'
  ConnectMode:
    Type: String
    Default: Existing
    AllowedValues: [Existing, Disposable]
  EnableQualificationRunner:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Creates the fixed qualification source EIP and CodeBuild runner role.
      Enable only in the approved nonproduction account.
  ArtifactBucketName:
    Type: String
    MinLength: 3
    MaxLength: 63
  EcrRepositoryName:
    Type: String
    MinLength: 2
    MaxLength: 256
    AllowedPattern: '^[a-z0-9]+(?:[._/-][a-z0-9]+)*$'
  ArtifactAccessMode:
    Type: String
    Default: EphemeralManage
    AllowedValues: [EphemeralManage, PersistentReadOnly]
  PublicHostedZoneId:
    Type: String
    Default: none
    AllowedPattern: '^(none|[A-Z0-9]+)$'
  EnableDemoSite:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

Conditions:
  HasPublicHostedZone: !Not [!Equals [!Ref PublicHostedZoneId, none]]
  CreateDemoSite: !Equals [!Ref EnableDemoSite, 'true']
  CreateDisposableConnect: !Equals [!Ref ConnectMode, Disposable]
  CreateQualificationRunner: !Or
    - !Equals [!Ref ConnectMode, Disposable]
    - !Equals [!Ref EnableQualificationRunner, 'true']
  HasGitHubOidc: !Not [!Equals [!Ref GitHubOidcProviderArn, none]]
  ManageEphemeralArtifacts: !Equals [!Ref ArtifactAccessMode, EphemeralManage]

Rules:
  GitHubOidcRequiresProtectedEnvironment:
    RuleCondition: !Not [!Equals [!Ref GitHubOidcProviderArn, none]]
    Assertions:
      - Assert: !Not [!Equals [!Ref GitHubEnvironment, none]]
        AssertDescription: GitHub OIDC requires an exact protected Bridgefu environment.

Resources:
  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bridgefu-${ExecutionId}-deployer'
      Description: !Sub 'Temporary Bridgefu recipe test deployer for ${ExecutionId}'
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {AWS: !Ref TrustedPrincipalArn}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:RoleSessionName: !Sub 'bridgefu-${ExecutionId}'
          - !If
            - HasGitHubOidc
            - Effect: Allow
              Principal: {Federated: !Ref GitHubOidcProviderArn}
              Action: sts:AssumeRoleWithWebIdentity
              Condition:
                StringEquals:
                  'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                  'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubRepository}:environment:${GitHubEnvironment}'
            - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Ref DeploymentControlPolicy
        - !Ref DeploymentArtifactPolicy
      Tags:
        - {Key: Project, Value: bridgefu-recipe}
        - {Key: ManagedBy, Value: bridgefu-test-bootstrap}
        - {Key: BridgefuExecutionId, Value: !Ref ExecutionId}

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bridgefu-${ExecutionId}-cloudformation'
      Description: !Sub 'CloudFormation service role for Bridgefu qualification ${ExecutionId}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref DeploymentControlPolicy
        - !Ref DeploymentArtifactPolicy
        - !Ref DeploymentApplicationPolicy
        - !Ref DeploymentComputePolicy
        - !Ref DeploymentDataPolicy
        - !If [CreateDisposableConnect, !Ref DeploymentDemoPolicy, !Ref AWS::NoValue]
        - !If [CreateQualificationRunner, !Ref DeploymentQualificationRunnerPolicy, !Ref AWS::NoValue]
      Tags:
        - {Key: Project, Value: bridgefu-recipe}
        - {Key: ManagedBy, Value: bridgefu-test-bootstrap}
        - {Key: BridgefuExecutionId, Value: !Ref ExecutionId}

  QualificationSourceEip:
    Type: AWS::EC2::EIP
    Condition: CreateQualificationRunner
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Domain: vpc
      Tags:
        - {Key: Project, Value: bridgefu-recipe}
        - {Key: ManagedBy, Value: bridgefu-test-bootstrap}
        - {Key: BridgefuExecutionId, Value: !Ref ExecutionId}

  QualificationRunnerRole:
    Type: AWS::IAM::Role
    Condition: CreateQualificationRunner
    Properties:
      RoleName: !Sub 'bridgefu-${ExecutionId}-runner'
      Description: !Sub 'Ephemeral CodeBuild qualification runner for ${ExecutionId}'
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BridgefuQualificationRunner
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadWriteExecutionArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:PutObjectTagging
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/qualification/${ExecutionId}/*'
              - Sid: ReadImmutableQualificationBundle
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/qualification/${ExecutionId}/*/artifacts/qualification/*'
              - Sid: WriteRunnerLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/bridgefu/${ExecutionId}/qualification-runner:*'
              - Sid: ManageCodeBuildVpcInterfaces
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeDhcpOptions
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                Resource: '*'
              - Sid: PermitCodeBuildVpcInterface
                Effect: Allow
                Action: ec2:CreateNetworkInterfacePermission
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*'
                Condition:
                  StringEquals:
                    ec2:AuthorizedService: codebuild.amazonaws.com
              - Sid: ReadOwnedQualificationCredentials
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bridgefu-${ExecutionId}-*'
              - Sid: AssumeExactQualificationRole
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-qualifier'
      Tags:
        - {Key: Project, Value: bridgefu-recipe}
        - {Key: ManagedBy, Value: bridgefu-test-bootstrap}
        - {Key: BridgefuExecutionId, Value: !Ref ExecutionId}

  DeploymentControlPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'bridgefu-${ExecutionId}-deployer-control'
      Description: Temporary scoped CloudFormation review, lifecycle, validation, and service-role policy.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RecipeCloudFormationLifecycle
            Effect: Allow
            Action:
              - cloudformation:CancelUpdateStack
              - cloudformation:ContinueUpdateRollback
              - cloudformation:CreateChangeSet
              - cloudformation:CreateStack
              - cloudformation:DeleteChangeSet
              - cloudformation:DeleteStack
              - cloudformation:DescribeChangeSet
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResource
              - cloudformation:DescribeStackResources
              - cloudformation:DescribeStacks
              - cloudformation:DetectStackDrift
              - cloudformation:ExecuteChangeSet
              - cloudformation:GetStackPolicy
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
              - cloudformation:ListStackResources
              - cloudformation:RollbackStack
              - cloudformation:SetStackPolicy
              - cloudformation:UpdateStack
              - cloudformation:UpdateTerminationProtection
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/bridgefu-${ExecutionId}*/*'
          - Sid: InspectStackDriftDetections
            Effect: Allow
            Action: cloudformation:DescribeStackDriftDetectionStatus
            Resource: '*'
          - Sid: ValidateExactTemplates
            Effect: Allow
            Action: cloudformation:ValidateTemplate
            Resource: '*'
          - Sid: InspectExactDeploymentPolicies
            Effect: Allow
            Action:
              - iam:GetPolicy
              - iam:GetPolicyVersion
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/bridgefu-${ExecutionId}-deployer-*'
          - Sid: InspectExactDeploymentRolePolicies
            Effect: Allow
            Action:
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-deployer'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-cloudformation'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-qualifier'
              - !If
                - CreateQualificationRunner
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-runner'
                - !Ref AWS::NoValue
          - Sid: ReadDeploymentPreflightBaseline
            Effect: Allow
            Action:
              - access-analyzer:ListAnalyzers
              - aws-portal:ViewBilling
              - budgets:ViewBudget
              - cloudformation:DescribeAccountLimits
              - cloudtrail:DescribeTrails
              - cloudtrail:GetTrailStatus
              - cloudwatch:DescribeAlarms
              - config:DescribeConfigurationRecorders
              - config:DescribeConfigurationRecorderStatus
              - config:DescribeDeliveryChannels
              - connect:ListInstances
              - ec2:DescribeAccountAttributes
              - ec2:DescribeAddresses
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeInternetGateways
              - ec2:DescribeNatGateways
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
              - guardduty:GetDetector
              - guardduty:ListDetectors
              - lambda:GetAccountSettings
              - organizations:DescribeOrganization
              - securityhub:DescribeHub
              - servicequotas:GetServiceQuota
            Resource: '*'
          - !If
            - CreateDisposableConnect
            - Sid: DeleteExactDisposableConnectLogFallback
              Effect: Allow
              Action:
                - logs:DeleteLogGroup
                - logs:ListTagsForResource
              Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/connect/${ExecutionId}-connect:*'
            - !Ref AWS::NoValue
          - !If
            - CreateDisposableConnect
            - Sid: DiscoverExactDisposableConnectLogFallback
              Effect: Allow
              Action: logs:DescribeLogGroups
              Resource: '*'
            - !Ref AWS::NoValue
          - Sid: ReadExactConnectPreflightTarget
            Effect: Allow
            Action:
              - connect:DescribeContactFlow
              - connect:DescribeInstance
            Resource:
              - !Ref ConnectInstanceArn
              - !Sub '${ConnectInstanceArn}/contact-flow/*'
          - !If
            - HasPublicHostedZone
            - Sid: ReadExactPreflightPublicZone
              Effect: Allow
              Action: route53:GetHostedZone
              Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/${PublicHostedZoneId}'
            - !Ref AWS::NoValue
          - Sid: ValidateDeploymentPolicies
            Effect: Allow
            Action: access-analyzer:ValidatePolicy
            Resource: '*'
          - Sid: PassExactCloudFormationExecutionRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-cloudformation'
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com

  DeploymentArtifactPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'bridgefu-${ExecutionId}-deployer-artifacts'
      Description: Temporary scoped Bridgefu test policy for release artifacts and application IAM.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - !If
            - ManageEphemeralArtifacts
            - Sid: CreateOnlyExactArtifactBucket
              Effect: Allow
              Action: s3:CreateBucket
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}'
            - !Ref AWS::NoValue
          - !If
            - ManageEphemeralArtifacts
            - Sid: ManageOnlyExactArtifactBucket
              Effect: Allow
              Action:
                - s3:DeleteBucket
                - s3:DeleteObject
                - s3:DeleteObjectVersion
                - s3:GetEncryptionConfiguration
                - s3:GetBucketAcl
                - s3:GetBucketLocation
                - s3:GetBucketPolicy
                - s3:GetBucketPublicAccessBlock
                - s3:GetBucketTagging
                - s3:GetBucketVersioning
                - s3:GetObject
                - s3:GetObjectVersion
                - s3:ListBucket
                - s3:ListBucketVersions
                - s3:PutEncryptionConfiguration
                - s3:PutBucketOwnershipControls
                - s3:PutBucketPolicy
                - s3:PutBucketPublicAccessBlock
                - s3:PutBucketTagging
                - s3:PutBucketVersioning
                - s3:PutObject
                - s3:PutObjectTagging
                - s3:TagResource
                - s3:UntagResource
              Resource:
                - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}'
                - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*'
            - Sid: ReadOnlyPersistentArtifactBucket
              Effect: Allow
              Action:
                - s3:GetBucketLocation
                - s3:GetBucketVersioning
                - s3:GetObject
                - s3:GetObjectVersion
                - s3:ListBucket
                - s3:ListBucketVersions
              Resource:
                - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}'
                - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*'
          - !If
            - ManageEphemeralArtifacts
            - Sid: ManageOnlyEphemeralVapiVerificationSecrets
              Effect: Allow
              Action:
                - secretsmanager:CreateSecret
                - secretsmanager:DeleteSecret
                - secretsmanager:DescribeSecret
                - secretsmanager:GetSecretValue
                - secretsmanager:TagResource
              Resource:
                - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bridgefu-${ExecutionId}-vapi-api-key-*'
                - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bridgefu-${ExecutionId}-vapi-public-key-*'
            - !Ref AWS::NoValue
          - !If
            - CreateDemoSite
            - Sid: CreateOnlyExactDemoSiteBucket
              Effect: Allow
              Action: s3:CreateBucket
              Resource: !Sub 'arn:${AWS::Partition}:s3:::bfu-${AWS::AccountId}-${AWS::Region}-${ExecutionId}-site'
            - !Ref AWS::NoValue
          - !If
            - CreateDemoSite
            - Sid: ManageOnlyExactDemoSiteBucket
              Effect: Allow
              Action:
                - s3:DeleteBucket
                - s3:DeleteBucketPolicy
                - s3:DeleteObject
                - s3:GetBucketLocation
                - s3:GetBucketAcl
                - s3:GetBucketOwnershipControls
                - s3:GetBucketPolicy
                - s3:GetBucketPublicAccessBlock
                - s3:GetBucketTagging
                - s3:GetEncryptionConfiguration
                - s3:GetObject
                - s3:ListBucket
                - s3:PutBucketOwnershipControls
                - s3:PutBucketPolicy
                - s3:PutBucketPublicAccessBlock
                - s3:PutBucketTagging
                - s3:PutEncryptionConfiguration
                - s3:PutObject
                - s3:TagResource
                - s3:UntagResource
              Resource:
                - !Sub 'arn:${AWS::Partition}:s3:::bfu-${AWS::AccountId}-${AWS::Region}-${ExecutionId}-site'
                - !Sub 'arn:${AWS::Partition}:s3:::bfu-${AWS::AccountId}-${AWS::Region}-${ExecutionId}-site/*'
            - !Ref AWS::NoValue
          - Sid: AuthenticateEcr
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - !If
            - ManageEphemeralArtifacts
            - Sid: ManageOnlyExactEcrRepository
              Effect: Allow
              Action:
                - ecr:BatchCheckLayerAvailability
                - ecr:BatchDeleteImage
                - ecr:BatchGetImage
                - ecr:CompleteLayerUpload
                - ecr:CreateRepository
                - ecr:DeleteRepository
                - ecr:DescribeImages
                - ecr:DescribeRepositories
                - ecr:GetDownloadUrlForLayer
                - ecr:GetLifecyclePolicy
                - ecr:GetRepositoryPolicy
                - ecr:InitiateLayerUpload
                - ecr:ListImages
                - ecr:ListTagsForResource
                - ecr:PutImage
                - ecr:PutImageScanningConfiguration
                - ecr:PutImageTagMutability
                - ecr:PutLifecyclePolicy
                - ecr:SetRepositoryPolicy
                - ecr:TagResource
                - ecr:UntagResource
                - ecr:UploadLayerPart
              Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}'
            - Sid: ReadOnlyPersistentEcrRepository
              Effect: Allow
              Action:
                - ecr:BatchCheckLayerAvailability
                - ecr:BatchGetImage
                - ecr:DescribeImages
                - ecr:DescribeRepositories
                - ecr:GetDownloadUrlForLayer
                - ecr:ListImages
                - ecr:ListTagsForResource
              Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}'
          - Sid: ManageRecipeRolesOnly
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:CreateRole
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:PassRole
              - iam:PutRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
              - iam:UpdateRole
              - iam:UpdateRoleDescription
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-prepare'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-transfer'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-lookup'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-gateway'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-backup'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-vapi-provisioner'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-demo-site-publisher'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-ha-task-execution'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-ha-gateway-task'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-ha-worker-task'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-ha-gateway-host'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-ha-worker-host'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-ha-lifecycle-publish'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-ha-lifecycle'
          - Sid: ManageRecipeInstanceProfileOnly
            Effect: Allow
            Action:
              - iam:AddRoleToInstanceProfile
              - iam:CreateInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:GetInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/bridgefu-${ExecutionId}-*'

  DeploymentApplicationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'bridgefu-${ExecutionId}-deployer-application'
      Description: Temporary scoped Bridgefu test policy for recipe application services.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ManageRecipeFunctionsOnly
            Effect: Allow
            Action:
              - lambda:AddPermission
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:DeleteFunctionConcurrency
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:GetPolicy
              - lambda:InvokeFunction
              - lambda:ListTags
              - lambda:PublishVersion
              - lambda:PutFunctionConcurrency
              - lambda:RemovePermission
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
            Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:bridgefu-${ExecutionId}-*'
          - Sid: ManageRecipeTablesOnly
            Effect: Allow
            Action:
              - dynamodb:CreateBackup
              - dynamodb:CreateTable
              - dynamodb:DeleteTable
              - dynamodb:DescribeContinuousBackups
              - dynamodb:DescribeTable
              - dynamodb:DescribeTimeToLive
              - dynamodb:ListTagsOfResource
              - dynamodb:TagResource
              - dynamodb:UntagResource
              - dynamodb:UpdateContinuousBackups
              - dynamodb:UpdateTable
              - dynamodb:UpdateTimeToLive
            Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/bridgefu-${ExecutionId}-*'
          - Sid: ManageRecipeSecretsOnly
            Effect: Allow
            Action:
              - secretsmanager:CreateSecret
              - secretsmanager:DeleteResourcePolicy
              - secretsmanager:DeleteSecret
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
              - secretsmanager:GetResourcePolicy
              - secretsmanager:ListSecretVersionIds
              - secretsmanager:PutResourcePolicy
              - secretsmanager:PutSecretValue
              - secretsmanager:RestoreSecret
              - secretsmanager:TagResource
              - secretsmanager:UntagResource
              - secretsmanager:UpdateSecret
            Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bridgefu-${ExecutionId}-*'
          - Sid: GenerateRecipeSecretValues
            Effect: Allow
            Action: secretsmanager:GetRandomPassword
            Resource: '*'
          - Sid: ManageRecipeLogsOnly
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:DeleteMetricFilter
              - logs:DescribeMetricFilters
              - logs:ListTagsForResource
              - logs:PutMetricFilter
              - logs:PutRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/bridgefu-${ExecutionId}-*:*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/bridgefu-${ExecutionId}-*:*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/bridgefu/${ExecutionId}/*:*'
          - Sid: DiscoverRecipeLogGroups
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: '*'
          - Sid: ManageElastiCacheLogDelivery
            Effect: Allow
            Action:
              - logs:CreateLogDelivery
              - logs:DeleteLogDelivery
              - logs:DescribeResourcePolicies
              - logs:GetLogDelivery
              - logs:ListLogDeliveries
              - logs:PutResourcePolicy
              - logs:UpdateLogDelivery
            Resource: '*'
          - Sid: ManageRecipeApiGatewayOnly
            Effect: Allow
            Action:
              - apigateway:DELETE
              - apigateway:GET
              - apigateway:PATCH
              - apigateway:POST
              - apigateway:PUT
              # Required by the live AWS::ApiGatewayV2::Stage handler even
              # though IAM Access Analyzer's action catalog currently lags it.
              - apigateway:TagResource
              - apigateway:UntagResource
            Resource:
