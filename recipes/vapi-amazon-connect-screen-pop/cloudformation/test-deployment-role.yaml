              StringEquals:
                iam:PassedToService: codebuild.amazonaws.com

  QualificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bridgefu-${ExecutionId}-qualifier'
      Description: !Sub 'Temporary read-mostly Bridgefu test role for ${ExecutionId}'
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {AWS: !Ref TrustedPrincipalArn}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:RoleSessionName: !Sub 'bridgefu-${ExecutionId}-qualification'
          - !If
            - CreateQualificationRunner
            - Effect: Allow
              Principal:
                AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bridgefu-${ExecutionId}-runner'
                  sts:RoleSessionName: !Sub 'bridgefu-${ExecutionId}-qualification'
            - !Ref AWS::NoValue
      Policies:
        - PolicyName: BridgefuRecipeQualification
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRecipeStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplate
                  - cloudformation:ListStackResources
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/bridgefu-${ExecutionId}*/*'
              - Sid: ReadRecipeRuntimeMetadata
                Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeAutoScalingInstances
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:GetDashboard
                  - cloudwatch:GetMetricData
                  - ec2:Describe*
                  - ecs:DescribeClusters
                  - ecs:DescribeContainerInstances
                  - ecs:DescribeServices
                  - ecs:DescribeTasks
                  - ecs:ListContainerInstances
                  - ecs:ListTasks
                  - elasticache:DescribeReplicationGroups
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetHealth
                  - lambda:GetFunctionConfiguration
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:FilterLogEvents
                  - rds:DescribeDBInstances
                  - ssm:DescribeInstanceInformation
                Resource: '*'
              - Sid: UseAwsRunShellScriptDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript'
              - Sid: CommandOnlyOwnedQualificationInstances
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals:
                    ssm:resourceTag/BridgefuExecutionId: !Ref ExecutionId
                    ssm:resourceTag/ManagedBy: bridgefu-cloudformation
              - Sid: RebootOnlyOwnedQualificationInstances
                Effect: Allow
                Action: ec2:RebootInstances
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals:
                    ec2:ResourceTag/BridgefuExecutionId: !Ref ExecutionId
                    ec2:ResourceTag/ManagedBy: bridgefu-cloudformation
              - Sid: ReadOwnedQualificationCommandResults
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
              - !If
                - CreateDemoSite
                - Sid: ReadRecipeDemoCloudFront
                  Effect: Allow
                  Action:
                    - cloudfront:GetDistribution
                    - cloudfront:GetDistributionConfig
                    - cloudfront:ListTagsForResource
                  Resource: '*'
                - !Ref AWS::NoValue
              - Sid: InspectRecipeTable
                Effect: Allow
                Action:
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:GetItem
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/bridgefu-${ExecutionId}-*'
              - Sid: DeleteOnlySyntheticQualificationContext
                Effect: Allow
                Action: dynamodb:DeleteItem
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/bridgefu-${ExecutionId}-*'
              - Sid: ReadOnlyTestCredentials
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bridgefu-${ExecutionId}-vapi-webhook-*'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bridgefu-${ExecutionId}-correlation-key-*'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bridgefu-${ExecutionId}-demo-agent-credential-*'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bridgefu-${ExecutionId}-vapi-api-key-*'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bridgefu-${ExecutionId}-vapi-public-key-*'
              - Sid: InvokeRecipeLookup
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:bridgefu-${ExecutionId}-lookup'
              - Sid: SearchBoundedQualificationContacts
                Effect: Allow
                Action: connect:SearchContacts
                Resource: !If [CreateDisposableConnect, '*', !Ref ConnectInstanceArn]
              - !If
                - CreateQualificationRunner
                - Sid: RunHeadlessQualification
                  Effect: Allow
                  Action:
                    - codebuild:BatchGetBuilds
                    - codebuild:ListBuildsForProject
                    - codebuild:StartBuild
                    - codebuild:StopBuild
                  Resource: !Sub 'arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/bridgefu-${ExecutionId}-qualification'
                - !Ref AWS::NoValue
              - !If
                - CreateQualificationRunner
                - Sid: ExchangeHeadlessQualificationArtifacts
                  Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:GetObjectVersion
                    - s3:PutObject
                    - s3:PutObjectTagging
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/qualification/${ExecutionId}/*'
                - !Ref AWS::NoValue
              - Sid: ReadRecipeDns
                Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                Resource: '*'
              - Sid: VerifyOwnedResources
                Effect: Allow
                Action: tag:GetResources
                Resource: '*'
      Tags:
        - {Key: Project, Value: bridgefu-recipe}
        - {Key: ManagedBy, Value: bridgefu-test-bootstrap}
        - {Key: BridgefuExecutionId, Value: !Ref ExecutionId}

Outputs:
  DeploymentRoleArn:
    Value: !GetAtt DeploymentRole.Arn
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
  DeploymentRoleSessionName:
    Value: !Sub 'bridgefu-${ExecutionId}'
  QualificationRoleArn:
    Value: !GetAtt QualificationRole.Arn
  QualificationRoleSessionName:
    Value: !Sub 'bridgefu-${ExecutionId}-qualification'
  QualificationRunnerRoleArn:
    Condition: CreateQualificationRunner
    Value: !GetAtt QualificationRunnerRole.Arn
  QualificationSourceEipAllocationId:
    Condition: CreateQualificationRunner
