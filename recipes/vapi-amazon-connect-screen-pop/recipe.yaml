api_version: bridgefu.dev/recipe/v1
kind: bridge_recipe

metadata:
  name: vapi-amazon-connect-screen-pop
  version: 1
  title: Vapi to Amazon Connect screen pop
  support: preview
  description: >-
    Receives a Vapi SIP transfer, carries one opaque correlation ID into an
    Amazon Connect WebRTC contact, and enables an AWS-native agent screen pop.

inputs:
  vapi_signaling_cidrs:
    type: cidr_list
    required: true
    description: Verified Vapi SIP signaling networks admitted by the recipe.
  connect_instance_arn:
    type: aws_arn
    required: true
    description: ARN of the customer's existing Amazon Connect instance.
  connect_entry_contact_flow_id:
    type: aws_connect_resource_id
    required: true
    description: >-
      ID of the recipe-owned wrapper entry flow generated in the customer's
      existing instance. This is not the customer's target flow ID.
  sip_security:
    type: enum
    values: [sips_srtp, sips_optional_srtp, sip_rtp]
    default: sips_srtp
    description: >-
      SIPS/SRTP is the production default. SIPS with optional SRTP keeps SIP
      signaling encrypted while interoperating with peers that offer RTP/AVP.
      SIP/RTP is diagnostic compatibility only.

spec:
  bridges:
    transfer:
      source:
        type: sip
        security:
          $input: sip_security
        admission:
          mode: managed_attachment
          trusted_cidrs:
            $input: vapi_signaling_cidrs
      destination:
        type: amazon_connect
        media: webrtc
        instance_arn:
          $input: connect_instance_arn
        contact_flow_id:
          $input: connect_entry_contact_flow_id
      context:
        correlation:
          required: true
          from_sip_header: X-Correlation-Id
          to_amazon_attribute: correlation_id
          format: opaque_id_v1
