AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Persistent artifact foundation for the non-HA Bridgefu browser WebRTC to
  Amazon Connect proof. This stack creates no runtime, media, or Connect
  resources and contains no account-specific defaults.

Metadata:
  BridgefuRecipe:
    Id: webrtc-amazon-connect-bridge@1
    Component: nonproduction-foundation

Parameters:
  DeploymentId:
    Type: String
    Default: bridgefu-browser-nonprod
    MinLength: 3
    MaxLength: 32
    AllowedPattern: '^[a-z][a-z0-9-]+$'
  ArtifactRetentionDays:
    Type: Number
    Default: 30
    MinValue: 7
    MaxValue: 365
  ProjectTag:
    Type: String
    Default: bridgefu-recipe
  ManagedByTag:
    Type: String
    Default: bridgefu-cloudformation

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-artifacts
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref ArtifactRetentionDays
      Tags:
        - {Key: Name, Value: !Sub '${DeploymentId}-artifacts'}
        - {Key: Project, Value: !Ref ProjectTag}
        - {Key: ManagedBy, Value: !Ref ManagedByTag}
        - {Key: BridgefuRecipe, Value: webrtc-amazon-connect-bridge@1}
        - {Key: BridgefuEnvironment, Value: nonproduction}

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTls
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
            Condition: {Bool: {'aws:SecureTransport': 'false'}}

  ImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Expire untagged images after 14 days","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":14},"action":{"type":"expire"}}]}
      Tags:
        - {Key: Name, Value: !Sub '${DeploymentId}-images'}
        - {Key: Project, Value: !Ref ProjectTag}
        - {Key: ManagedBy, Value: !Ref ManagedByTag}
        - {Key: BridgefuRecipe, Value: webrtc-amazon-connect-bridge@1}
        - {Key: BridgefuEnvironment, Value: nonproduction}

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  ArtifactBucketArn:
    Value: !GetAtt ArtifactBucket.Arn
  PackagePrefix:
    Value: !Sub 'webrtc-amazon-connect-bridge/${DeploymentId}'
  ImageRepositoryName:
    Value: !Ref ImageRepository
  ImageRepositoryArn:
    Value: !GetAtt ImageRepository.Arn
  ImageRepositoryUri:
    Value: !GetAtt ImageRepository.RepositoryUri
