config_version: 1
aws:
  region: us-west-2
edge:
  public_host: sip.bridgefu.example
  media_public_addr: 203.0.113.10:0
  sip_tls:
    bind: 0.0.0.0:5061
    advertised_addr: 203.0.113.10:5061
    certificate_chain: /run/bridgefu/tls/fullchain.pem
    private_key: env:BRIDGEFU_SIP_TLS_PRIVATE_KEY_PATH
api:
  enabled: true
  bearer_token: env:BRIDGEFU_API_BEARER_TOKEN
  control_hmac_key: env:BRIDGEFU_CONTROL_HMAC_KEY
recipe_catalog:
  paths:
  - examples/vapi-amazon-connect/correlation-id/recipe
recipes:
  support:
    use: external:vapi-connect-correlation-id@1
    with:
      signaling_cidrs:
      - 198.51.100.0/24
      connect_instance_arn: arn:aws:connect:us-west-2:123456789012:instance/11111111-1111-1111-1111-111111111111
      contact_flow_id: 22222222-2222-2222-2222-222222222222
      sip_security: sips_srtp
context:
  allow_headers:
    X-Correlation-Id: handoff_id
persistence:
  backend: sqlite
  database_url: sqlite:///var/lib/bridgefu/bridgefu.db
observability:
  log_level: info
  log_format: json
  http_bind: 127.0.0.1:9090
runtime:
  mode: all-in-one
  max_concurrent_calls: 10
  setup_timeout_secs: 30
  media_idle_timeout_secs: 120
  drain_timeout_secs: 30
