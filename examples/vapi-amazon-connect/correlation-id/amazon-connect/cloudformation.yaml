AWSTemplateFormatVersion: '2010-09-09'
Description: Disposable Bridgefu correlation-id example; customer field contract generated from settings.
Parameters:
  ConnectInstanceArn:
    Type: String
    Description: Existing Connect instance ARN in this stack region.
  TargetContactFlowArn:
    Type: String
    Description: Published flow in that same instance to receive the handoff.
  VapiApiKeySecretArn:
    Type: String
    Description: Secrets Manager ARN whose plaintext value is the Vapi private key.
  GatewaySipUri:
    Type: String
    Description: Fixed Bridgefu SIP address, including TLS transport.
Resources:
  WebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Authentication for this example Vapi webhook
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
  ContextTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
  TransferRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: example-transfer
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
            - Ref: VapiApiKeySecretArn
            - Ref: WebhookSecret
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*:*
          - Effect: Allow
            Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            Resource:
              Fn::GetAtt:
              - ContextTable
              - Arn
  TransferFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-transfer
      RetentionInDays: 7
  TransferFunction:
    Type: AWS::Lambda::Function
    DependsOn: TransferFunctionLogs
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-transfer
      Runtime: python3.12
      Handler: index.transfer
      Role:
        Fn::GetAtt:
        - TransferRole
        - Arn
      Timeout: 25
      MemorySize: 256
      Environment:
        Variables:
          FIELD_CONFIG: '{"mode":"correlation-id","fields":[{"name":"session","source":"variables.customer_session","header":"X-Customer-Session","attribute":"customer_session","description":"Customer-supplied
            session; never generated by the model.","max_bytes":128,"required":true,"example":"synthetic-session-001"},{"name":"vapi_reference","source":"call.id","header":"X-Vapi-Call-Id","attribute":"vapi_reference","description":"Vapi-generated
            call reference.","max_bytes":36,"required":true},{"name":"intent","source":"arguments.intent","header":"X-Customer-Intent","attribute":"customer_intent","description":"Short
            reason for the human handoff.","max_bytes":128,"required":true},{"name":"summary","source":"arguments.summary","header":"X-Conversation-Summary","attribute":"conversation_summary","description":"Brief
            factual conversation summary, including troubleshooting already attempted.","max_bytes":512,"required":true}],"correlation":{"header":"X-Correlation-Id","attribute":"handoff_id","ttl_seconds":3600},"tool_name":"transfer_to_support","status_attribute":"handoff_status"}'
          VAPI_SECRET_ARN:
            Ref: VapiApiKeySecretArn
          WEBHOOK_SECRET_ARN:
            Ref: WebhookSecret
          GATEWAY_SIP_URI:
            Ref: GatewaySipUri
          CONNECT_INSTANCE_ARN:
            Ref: ConnectInstanceArn
          CONTEXT_TABLE:
            Ref: ContextTable
      Code:
        ZipFile: "\"\"\"Example Lambda runtime. Customer data is defined entirely by FIELD_CONFIG.\n\nThe deploy\
          \ script inlines this file into CloudFormation. Never log events,\nprovider responses, SIP values, control\
          \ URLs, or credentials.\n\"\"\"\n\nimport base64\nimport hashlib\nimport hmac\nimport json\nimport os\n\
          import time\nimport urllib.error\nimport urllib.parse\nimport urllib.request\n\nimport boto3\n\n_SECRET_CACHE\
          \ = {}\n\n\ndef configuration():\n    return json.loads(os.environ[\"FIELD_CONFIG\"])\n\n\ndef secret(arn):\n\
          \    if arn not in _SECRET_CACHE:\n        _SECRET_CACHE[arn] = boto3.client(\"secretsmanager\").get_secret_value(\n\
          \            SecretId=arn\n        )[\"SecretString\"]\n    return _SECRET_CACHE[arn]\n\n\ndef api(method,\
          \ path, body=None):\n    request = urllib.request.Request(\n        \"https://api.vapi.ai\" + path,\n\
          \        data=None if body is None else json.dumps(body).encode(),\n        method=method,\n        headers={\n\
          \            \"Authorization\": \"Bearer \" + secret(os.environ[\"VAPI_SECRET_ARN\"]),\n            \"\
          Content-Type\": \"application/json\",\n            \"User-Agent\": \"bridgefu-examples/1.0\",\n      \
          \  },\n    )\n    with urllib.request.urlopen(request, timeout=5) as response:\n        return json.load(response)\n\
          \n\ndef value_at(data, path):\n    for key in path.split(\".\"):\n        if not isinstance(data, dict):\n\
          \            return None\n        data = data.get(key)\n    return data\n\n\ndef values_for(config, call,\
          \ arguments):\n    variables = call.get(\"assistantOverrides\", {}).get(\"variableValues\", {})\n    values\
          \ = {}\n    for field in config[\"fields\"]:\n        source, path = field[\"source\"].split(\".\", 1)\n\
          \        value = value_at(\n            {\"call\": call, \"variables\": variables, \"arguments\": arguments}[source],\
          \ path\n        )\n        if value is None and not field.get(\"required\", True):\n            continue\n\
          \        if (\n            not isinstance(value, str)\n            or not value.strip()\n            or\
          \ len(value.encode(\"utf-8\")) > field[\"max_bytes\"]\n            or any(ord(c) < 32 or ord(c) == 127\
          \ for c in value)\n            or \"{{\" in value\n            or \"}}\" in value\n        ):\n      \
          \      raise ValueError(\"invalid_field\")\n        values[field[\"attribute\"]] = value\n    return values\n\
          \n\ndef destination(config, values, call_id, tool_id, webhook_secret):\n    if config[\"mode\"] == \"\
          sip-headers\":\n        headers = {\n            f[\"header\"]: values[f[\"attribute\"]]\n           \
          \ for f in config[\"fields\"]\n            if f[\"attribute\"] in values\n        }\n    else:\n     \
          \   # Stable, unguessable for retries of the same tool invocation; no model involvement.\n        token\
          \ = hmac.new(\n            webhook_secret.encode(), (call_id + \":\" + tool_id).encode(), hashlib.sha256\n\
          \        ).hexdigest()[:32]\n        table = boto3.resource(\"dynamodb\").Table(os.environ[\"CONTEXT_TABLE\"\
          ])\n        item = {\n            \"id\": token,\n            \"values\": values,\n            \"expires_at\"\
          : int(time.time()) + config[\"correlation\"][\"ttl_seconds\"],\n        }\n        try:\n            table.put_item(Item=item,\
          \ ConditionExpression=\"attribute_not_exists(id)\")\n        except table.meta.client.exceptions.ConditionalCheckFailedException:\n\
          \            previous = table.get_item(Key={\"id\": token}, ConsistentRead=True).get(\n              \
          \  \"Item\", {}\n            )\n            if previous.get(\"values\") != values or int(\n          \
          \      previous.get(\"expires_at\", 0)\n            ) <= int(time.time()):\n                raise ValueError(\"\
          conflicting_or_expired_retry\") from None\n        headers = {config[\"correlation\"][\"header\"]: token}\n\
          \    return {\n        \"type\": \"sip\",\n        \"sipUri\": os.environ[\"GATEWAY_SIP_URI\"],\n    \
          \    \"sipHeaders\": headers,\n        \"transferPlan\": {\"mode\": \"blind-transfer\", \"sipVerb\": \"\
          dial\"},\n    }\n\n\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self,\
          \ req, fp, code, msg, headers, newurl):\n        return None\n\n\ndef control(call, dest):\n    # URL\
          \ is obtained from the authenticated Vapi GET /call, not tool arguments\n    # or a caller-supplied callback.\
          \ It may itself contain a bearer capability.\n    url = call.get(\"monitor\", {}).get(\"controlUrl\")\n\
          \    parsed = urllib.parse.urlparse(url or \"\")\n    if (\n        parsed.scheme != \"https\"\n     \
          \   or not parsed.netloc\n        or parsed.username\n        or parsed.password\n    ):\n        raise\
          \ ValueError(\"missing_control_url\")\n    request = urllib.request.Request(\n        url,\n        method=\"\
          POST\",\n        data=json.dumps({\"type\": \"transfer\", \"destination\": dest}).encode(),\n        headers={\n\
          \            \"Content-Type\": \"application/json\",\n            \"User-Agent\": \"bridgefu-examples/1.0\"\
          ,\n        },\n    )\n    with urllib.request.build_opener(NoRedirect).open(request, timeout=5) as response:\n\
          \        if not 200 <= response.status < 300:\n            raise ValueError(\"transfer_not_accepted\"\
          )\n\n\ndef transfer(event, _context):\n    headers = {k.lower(): v for k, v in event.get(\"headers\",\
          \ {}).items()}\n    expected = secret(os.environ[\"WEBHOOK_SECRET_ARN\"])\n    supplied = headers.get(\"\
          x-bridgefu-webhook-secret\", \"\")\n    if not isinstance(supplied, str) or not hmac.compare_digest(\n\
          \        supplied.encode(), expected.encode()\n    ):\n        return {\"statusCode\": 401, \"body\":\
          \ \"{}\"}\n    tool_id = None\n    stage = \"validate_request\"\n    try:\n        body = event.get(\"\
          body\", \"\")\n        if event.get(\"isBase64Encoded\"):\n            body = base64.b64decode(body).decode()\n\
          \        if len(body.encode()) > 1024 * 1024:\n            raise ValueError(\"request_too_large\")\n \
          \       message = json.loads(body)[\"message\"]\n        tools = message.get(\"toolCallList\") or [\n\
          \            x[\"toolCall\"] for x in message.get(\"toolWithToolCallList\", [])\n        ]\n        config\
          \ = configuration()\n        if message.get(\"type\") != \"tool-calls\" or len(tools) != 1:\n        \
          \    raise ValueError(\"unexpected_message\")\n        tool = tools[0]\n        tool_id = tool[\"id\"\
          ]\n        if not isinstance(tool_id, str) or not 1 <= len(tool_id) <= 128:\n            raise ValueError(\"\
          invalid_tool_id\")\n        if tool[\"function\"][\"name\"] != config[\"tool_name\"]:\n            raise\
          \ ValueError(\"unexpected_tool\")\n        call_id = message[\"call\"][\"id\"]\n        import re\n\n\
          \        if not isinstance(call_id, str) or not re.fullmatch(\n            r\"[0-9a-fA-F-]{36}\", call_id\n\
          \        ):\n            raise ValueError(\"invalid_call_id\")\n        stage = \"fetch_call\"\n     \
          \   call = api(\"GET\", \"/call/\" + call_id)\n        if call.get(\"id\") != call_id or call.get(\"status\"\
          ) != \"in-progress\":\n            raise ValueError(\"call_not_in_progress\")\n        arguments = tool[\"\
          function\"][\"arguments\"]\n        if isinstance(arguments, str):\n            arguments = json.loads(arguments)\n\
          \        if not isinstance(arguments, dict):\n            raise ValueError(\"invalid_arguments\")\n  \
          \      stage = \"validate_fields\"\n        values = values_for(config, call, arguments)\n        stage\
          \ = \"prepare_destination\"\n        dest = destination(config, values, call_id, tool_id, expected)\n\
          \        stage = \"request_transfer\"\n        control(call, dest)\n        result = \"Transfer requested.\"\
          \n    except Exception as error:\n        # Static stage and exception class only; never include provider\
          \ bodies or IDs.\n        print(\n            json.dumps(\n                {\n                    \"event\"\
          : \"handoff_failed\",\n                    \"stage\": stage,\n                    \"error_type\": type(error).__name__,\n\
          \                }\n            )\n        )\n        # A timeout is ambiguous. No automatic retry is\
          \ configured in the tool.\n        result = \"Transfer not confirmed. Do not retry automatically; continue\
          \ assisting the caller.\"\n        if tool_id is None:\n            return {\n                \"statusCode\"\
          : 400,\n                \"body\": json.dumps({\"error\": \"invalid_handoff_request\"}),\n            }\n\
          \    return {\n        \"statusCode\": 200,\n        \"headers\": {\"content-type\": \"application/json\"\
          },\n        \"body\": json.dumps({\"results\": [{\"toolCallId\": tool_id, \"result\": result}]}),\n  \
          \  }\n\n\ndef lookup(event, _context):\n    config = configuration()\n    status = config[\"status_attribute\"\
          ]\n    try:\n        contact = event[\"Details\"][\"ContactData\"]\n        if contact.get(\"InstanceARN\"\
          ) != os.environ[\"CONNECT_INSTANCE_ARN\"]:\n            return {status: \"invalid_instance\"}\n      \
          \  token = contact[\"Attributes\"].get(config[\"correlation\"][\"attribute\"], \"\")\n        import re\n\
          \n        if not re.fullmatch(r\"[0-9a-f]{32}\", token):\n            return {status: \"missing\"}\n \
          \       item = (\n            boto3.resource(\"dynamodb\")\n            .Table(os.environ[\"CONTEXT_TABLE\"\
          ])\n            .get_item(Key={\"id\": token}, ConsistentRead=True)\n            .get(\"Item\", {})\n\
          \        )\n        if int(item.get(\"expires_at\", 0)) <= int(time.time()):\n            return {status:\
          \ \"expired_or_missing\"}\n        allowed = {\n            field[\"attribute\"]: item.get(\"values\"\
          , {}).get(field[\"attribute\"], \"\")\n            for field in config[\"fields\"]\n        }\n      \
          \  # Connect Lambda STRING_MAP results must remain under 4 KiB.\n        response = {**allowed, status:\
          \ \"found\"}\n        if len(json.dumps(response).encode()) > 4000:\n            return {status: \"too_large\"\
          }\n        return response\n    except Exception:\n        return {status: \"unavailable\"}\n"
