[package]
name = "bridgefu"
version = "0.9.0"
edition = "2021"
rust-version = "1.95"
description = "Programmable SIP/RTP, WebRTC/RTP, provider-control, and QUIC audio bridge"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/eisenzopf/bridgefu"
repository = "https://github.com/eisenzopf/bridgefu"
keywords = ["sip", "webrtc", "rtp", "telephony", "voip"]
categories = ["network-programming", "multimedia::audio"]
publish = false

[workspace]
members = [
  "tools/recipe-qualification",
  "crates/vapire-iac",
  "crates/bridgefu-setup-core",
  "apps/bridgefu-setup",
]
default-members = [".", "crates/vapire-iac", "crates/bridgefu-setup-core"]
resolver = "2"

[dependencies]
# Bridgefu consumes the coordinated rvoip release from crates.io. Exact
# component versions keep the signaling/media type graph aligned and make
# Cargo.lock the complete reproducible dependency input.
rvoip-amazon-connect = { version = "=0.3.7", features = ["server", "aws-control"] }
rvoip-auth-core = "=0.3.7"
rvoip-core = "=0.3.7"
rvoip-moq = { version = "=0.3.7", features = ["relay-runtime"] }
rvoip-redis = { version = "=0.3.7", features = ["moq"] }
rvoip-quic = "=0.3.7"
rvoip-uctp = "=0.3.7"
rvoip-sip = { version = "=0.3.7", features = ["opus"] }
rvoip-sip-core = "=0.3.7"
rvoip-webrtc = { version = "=0.3.7", features = ["signaling-whip", "signaling-ws", "tls-rustls"] }
telnyx = { version = "=0.1.0", default-features = false, features = ["calls", "webhooks", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls-pemfile = "2"
rpassword = "7"
tempfile = "3"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic", "tls-ring", "tls-webpki-roots"] }
axum = "0.7"
axum-server = { version = "0.7.3", default-features = false, features = ["tls-rustls-no-provider"] }
tower-http = { version = "0.6", features = ["trace", "request-id"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "uuid", "migrate", "macros"] }
async-trait = "0.1"
base64 = "0.22"
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
futures-util = "0.3"
hmac = "0.12"
ipnet = "2.12"
jsonwebtoken = "9.3"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redis = { version = "1.0.4", default-features = false, features = ["tokio-rustls-comp", "connection-manager", "streams", "script"] }
sha1 = "0.10"
sha2 = "0.10"
thiserror = "1"
subtle = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }
bridgefu-setup-core = { path = "crates/bridgefu-setup-core" }

[dev-dependencies]
rvoip-media-core = { version = "=0.3.7", features = ["opus"] }
rcgen = "0.14"
tower = { version = "0.5", features = ["util"] }
webrtc = { package = "rvoip-webrtc-stack", version = "=0.3.7" }

# bridgefu is the build root, so this profile governs the WHOLE dependency tree
# (it overrides the rvoip workspace's `lto = true, codegen-units = 1`, which are
# memory- and time-hungry across the full SIP/WebRTC/AWS tree). `thin` LTO + many
# codegen units keeps the on-instance build fast and within RAM, while opt-level 2
# is plenty for a POC gateway whose hot path is a single audio bridge.
[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 2
