# Non-secret, schema-valid deployment fixture paired with
# reference-tenant-managed-routes.env. All addresses use reserved example ranges
# or .test names; every credential is an env: reference.
config_version: 1

aws:
  region: us-west-2

sip:
  bind_ip: 0.0.0.0
  port: 5060
  advertised_ip: 203.0.113.10
  media_public_ip: 203.0.113.10

default_tenant: null
tenants:
  reference-tenant:
    instance_id: 00000000-0000-4000-8000-000000000101
    contact_flow_id: 00000000-0000-4000-8000-000000000102
    default_display_name: Vapi caller
    mapping:
      unmapped: drop
      rename:
        X-Correlation-Id: correlation_id

runtime:
  mode: all-in-one
  max_concurrent_calls: 100
  setup_timeout_secs: 30
  media_idle_timeout_secs: 30
  drain_timeout_secs: 30

persistence:
  backend: sqlite
  database_url: sqlite:///var/lib/bridgefu/reference-tenant.db
  deployment_id: reference-tenant
  worker_lease_ttl_secs: 30
  worker_renew_interval_secs: 10
  worker_capabilities:
    - sip
    - webrtc
    - sip_egress
    - webrtc_egress
    - amazon_connect
    - telnyx

api:
  enabled: true
  bearer_token: env:BRIDGEFU_API_TOKEN
  control_hmac_key: env:BRIDGEFU_CONTROL_HMAC_KEY
  static_tenant: reference-tenant
  route_attachments:
    sip_uri_template: sips:{token}@bridgefu.example.test:5061;transport=tls
    webrtc:
      signaling_uri: wss://bridgefu.example.test/webrtc
      ice_servers:
        - urls:
            - turns:turn.example.test:5349?transport=tcp
          username: bridgefu
          credential: env:BRIDGEFU_TURN_PASSWORD
  routes:
    amazon-connect:
      tenant_id: reference-tenant
      ingress: [sip, webrtc]
      vapi_ingress_profile: vapi-production
      webrtc_ingress_profile: browser-public
      destination_profile:
        type: amazon_connect
        profile_id: reference-tenant-connect
      destination:
        direction: outbound
        signaling_initiator: bridgefu
        media_flow: send_receive
        endpoint:
          type: amazon_connect
          config:
            instance_id: 00000000-0000-4000-8000-000000000101
            contact_flow_id: 00000000-0000-4000-8000-000000000102
        amazon_connect_start:
          profile: reference-tenant-connect
          instance_id: 00000000-0000-4000-8000-000000000101
          contact_flow_id: 00000000-0000-4000-8000-000000000102
          attributes:
            integration: bridgefu
          display_name: Vapi caller
          description: ReferenceTenant managed handoff
    generic-sip:
      tenant_id: reference-tenant
      ingress: [sip, webrtc]
      vapi_ingress_profile: vapi-production
      webrtc_ingress_profile: browser-public
      destination_profile:
        type: sip
        profile_id: call-center-sip
      destination:
        direction: outbound
        signaling_initiator: bridgefu
        media_flow: send_receive
        endpoint:
          type: sip
          config:
            uri: sips:agents@sbc.example.test:5061;transport=tls
            initial_context: required
    telnyx:
      tenant_id: reference-tenant
      ingress: [sip, webrtc]
      vapi_ingress_profile: vapi-production
      webrtc_ingress_profile: browser-public
      destination_profile:
        type: telnyx
        profile_id: reference-tenant-telnyx
      destination:
        direction: outbound
        signaling_initiator: bridgefu
        media_flow: send_receive
        endpoint:
          type: provider
          config:
            provider: telnyx
            account_profile: reference-tenant-telnyx
            destination: "+15555550100"
    generic-wss:
      tenant_id: reference-tenant
      ingress: [sip, webrtc]
      vapi_ingress_profile: vapi-production
      webrtc_ingress_profile: browser-public
      destination_profile:
        type: webrtc
        profile_id: call-center-wss
      destination:
        direction: outbound
        signaling_initiator: bridgefu
        media_flow: send_receive
        endpoint:
          type: webrtc
          config:
            signaling_uri: wss://agents.example.test/signaling

vapi_ingress_profiles:
  vapi-production:
    tenant_id: reference-tenant
    principal_subject: vapi-transfer-edge
    issuer: vapi-managed
    scopes: [calls:create]
    trusted_signaling_cidrs: [192.0.2.0/24]
    tls:
      certificate_chain: /run/tls/sip-public.pem
      private_key: env:BRIDGEFU_SIP_TLS_KEY_PATH
    srtp_required: true
    codecs: [pcmu, pcma, opus]

sip_profiles:
  call-center-sip:
    allowed_targets:
      - sips:agents@sbc.example.test:5061;transport=tls
    from_uri: sips:bridgefu@bridgefu.example.test
    outbound_proxy: sips:sbc.example.test:5061;lr
    auth:
      type: digest
      realm: sbc.example.test
      username: bridgefu
      password: env:BRIDGEFU_CALL_CENTER_SIP_PASSWORD
    tls_roots: [/run/tls/call-center-ca.pem]
    srtp: required
    codecs: [pcmu, pcma, opus]
    metadata_keys: [correlation_id]

webrtc_profiles:
  browser-public:
    allowed_signaling_origins: [wss://bridgefu.example.test]
    tls_roots: [/run/tls/public-ca.pem]
    ice_servers:
      - urls: ["turns:turn.example.test:5349?transport=tcp"]
        username: bridgefu
        credential: env:BRIDGEFU_TURN_PASSWORD
    codecs: [opus]
    data_channels: true
  call-center-wss:
    allowed_signaling_origins: [wss://agents.example.test]
    bearer_token: env:BRIDGEFU_CALL_CENTER_WSS_TOKEN
    tls_roots: [/run/tls/call-center-wss-ca.pem]
    codecs: [opus]
    data_channels: true

context:
  allow_headers:
    X-Correlation-Id: correlation_id

generic_bridge:
  enabled: true
  sip_bind: 0.0.0.0:5070
  webrtc_ws_bind: 0.0.0.0:8080
  webrtc_whip_bind: 0.0.0.0:8081
  sip:
    allow_cleartext_bearer: false
    advertised_addr: 203.0.113.10:5070
    media_public_addr: 203.0.113.10:0
    secure_listener:
      bind: 0.0.0.0:5061
      advertised_addr: 203.0.113.10:5061
      certificate_chain: /run/tls/sip-public.pem
      private_key: env:BRIDGEFU_SIP_TLS_KEY_PATH
      require_client_certificate: false
    srtp: required
    rtp_port_start: 20000
    rtp_port_end: 29999
    symmetric_rtp:
      enabled: true
      allow_ip_change: false
      probation_packets: 3
      max_rebindings: 2
      rebind_window_secs: 2
      max_sequence_jump: 512
  webrtc:
    udp_bind: 0.0.0.0:0
    audio_codecs: [opus]
    ice_servers:
      - urls: ["turns:turn.example.test:5349?transport=tcp"]
        username: bridgefu
        credential: env:BRIDGEFU_TURN_PASSWORD
    ice_transport_policy: all
    nat_1to1_ips: [203.0.113.10]
    nat_1to1_candidate_type: host
    gather_timeout_secs: 5
    connection_timeout_secs: 15
    trickle_ice: true

providers:
  telnyx:
    account_profile: reference-tenant-telnyx
    api_key: env:TELNYX_API_KEY
    connection_id: reference-tenant-test-connection
    webhook_public_key: env:TELNYX_WEBHOOK_PUBLIC_KEY
    from: "+15555550101"
    media_sip_authority: bridgefu.example.test:5061
    media_sip_username: telnyx-media
    media_sip_password: env:TELNYX_MEDIA_SIP_PASSWORD
    media_sip_realm: bridgefu
    media_sip_transport: TLS
    webhook_url: https://bridgefu.example.test/v1/providers/telnyx/webhooks
    base_url: https://api.telnyx.example.test/v2
    request_timeout_ms: 15000
    max_retries: 2
