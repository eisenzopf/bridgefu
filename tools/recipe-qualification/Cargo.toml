[package]
name = "bridgefu-recipe-qualification"
version = "0.9.0"
edition = "2021"
rust-version = "1.95"
publish = false
autobins = false

[[bin]]
name = "recipe_sip_source"
path = "../../examples/recipe_sip_source.rs"

[[bin]]
name = "recipe_sip_negative"
path = "../../examples/recipe_sip_negative.rs"

[dependencies]
anyhow = "1"
audiopus_sys = { version = "=0.2.2", features = ["static"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
rvoip-sip = { version = "=0.3.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
